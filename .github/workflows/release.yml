name: Release Obsidian plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (for example 0.1.5)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release bot token
        id: release-bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Look up release bot user ID
        id: release-bot-user
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
        run: |
          echo "id=$(gh api \"/users/${{ steps.release-bot-token.outputs.app-slug }}[bot]\" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.release-bot-token.outputs.token }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a valid semantic version without a v prefix: $VERSION" >&2
            exit 1
          fi

          package_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          manifest_version="$(node --input-type=module -e 'import manifest from "./manifest.json" with { type: "json" }; process.stdout.write(manifest.version)')"

          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "package.json ($package_version) and manifest.json ($manifest_version) must start in sync." >&2
            exit 1
          fi

          if [[ "$VERSION" == "$package_version" ]]; then
            echo "Version already matches the current release: $VERSION" >&2
            exit 1
          fi

      - name: Ensure release tag is available
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi

      - name: Update release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";

            for (const path of ["package.json", "manifest.json"]) {
              const metadata = JSON.parse(readFileSync(path, "utf8"));
              metadata.version = process.env.VERSION;
              writeFileSync(path, `${JSON.stringify(metadata, null, 2)}\n`);
            }
          '

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add package.json manifest.json
          git -c user.name="${{ steps.release-bot-token.outputs.app-slug }}[bot]" \
            -c user.email="${{ steps.release-bot-user.outputs.id }}+${{ steps.release-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com" \
            commit -m "chore: release $VERSION"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title="$VERSION" \
            main.js manifest.json styles.css
